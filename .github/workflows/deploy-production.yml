name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Deploy
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USERNAME }}
          password: ${{ secrets.APP_PASSWORD }}
          port: ${{ secrets.APP_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            node -v
            npm -v
            cd /var/www/ui.iwyfaf.ru/ariadna-ui/libraries/ariadna-ui-docs
            eval $(ssh-agent -s) && ssh-add ~/.ssh/git-runner.ui@iwyfaf.ru
            git reset --hard HEAD
            git clean -fd
            git pull --no-edit -X theirs
            npm i
            npm run docs:build
